<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Tangent SF RP</title>
    <style>
      html, body {
        background-color: #090d16;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      #root {
        width: 100%;
        height: 100%;
        background-color: #090d16;
      }
      .preboot-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        width: 100%;
        background: radial-gradient(circle at 50% 50%, #0d1527 0%, #090d16 100%);
        color: #22d3ee;
        user-select: none;
      }
      .preboot-ring {
        width: 56px;
        height: 56px;
        border: 2px solid rgba(34, 211, 238, 0.2);
        border-top: 2px solid #22d3ee;
        border-right: 2px solid #22d3ee;
        border-radius: 50%;
        animation: preboot-spin 0.8s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
        box-shadow: 0 0 15px rgba(34, 211, 238, 0.35);
      }
      .preboot-tag {
        margin-top: 20px;
        font-size: 11px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #22d3ee;
        text-shadow: 0 0 8px rgba(34, 211, 238, 0.6);
        animation: preboot-pulse 1.5s ease-in-out infinite alternate;
      }
      .preboot-sub {
        margin-top: 6px;
        font-size: 9px;
        letter-spacing: 0.15em;
        color: #64748b;
      }
      @keyframes preboot-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes preboot-pulse {
        0% { opacity: 0.6; }
        100% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="preboot-loader">
        <div class="preboot-ring"></div>
        <div class="preboot-tag">TANGENT SF RP // INITIALIZING QUANTUM CORE</div>
        <div class="preboot-sub">CONNECTING TO TERRAN DATA NET SATELLITE ARRAYS...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
