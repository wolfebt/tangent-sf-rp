<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Tangent SF RP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var scale = localStorage.getItem('tangent_text_scale');
          if (scale && scale !== 'standard') {
            document.documentElement.setAttribute('data-text-scale', scale);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body {
        background-color: #000000;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      #root {
        width: 100%;
        height: 100%;
        background-color: #000000;
      }
      .preboot-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        width: 100%;
        background: radial-gradient(circle at 50% 50%, #12161f 0%, #000000 100%);
        color: #22d3ee;
        user-select: none;
      }
      .preboot-emblem {
        position: relative;
        width: 80px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .preboot-planet {
        width: 64px;
        height: 64px;
        filter: drop-shadow(0 0 16px rgba(34, 211, 238, 0.65));
        animation: preboot-float 2.5s ease-in-out infinite alternate;
      }
      .preboot-reticle {
        position: absolute;
        inset: 0;
        border: 1.5px dashed rgba(34, 211, 238, 0.35);
        border-radius: 50%;
        animation: preboot-spin 12s linear infinite;
      }
      .preboot-tag {
        margin-top: 20px;
        font-size: 11px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #22d3ee;
        text-shadow: 0 0 8px rgba(34, 211, 238, 0.6);
        animation: preboot-pulse 1.5s ease-in-out infinite alternate;
      }
      .preboot-sub {
        margin-top: 6px;
        font-size: 9px;
        letter-spacing: 0.15em;
        color: #64748b;
      }
      @keyframes preboot-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes preboot-float {
        0% { transform: translateY(0px) scale(0.97); }
        100% { transform: translateY(-4px) scale(1.03); }
      }
      @keyframes preboot-pulse {
        0% { opacity: 0.6; }
        100% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="preboot-loader">
        <div class="preboot-emblem">
          <svg class="preboot-planet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
            <defs>
              <radialGradient id="pb-globe" cx="34%" cy="30%" r="66%">
                <stop offset="0%" stop-color="#ecfeff" />
                <stop offset="16%" stop-color="#a5f3fc" />
                <stop offset="38%" stop-color="#22d3ee" />
                <stop offset="68%" stop-color="#0891b2" />
                <stop offset="88%" stop-color="#0e4b5c" />
                <stop offset="100%" stop-color="#031b24" />
              </radialGradient>
              <radialGradient id="pb-rim" cx="50%" cy="50%" r="50%">
                <stop offset="76%" stop-color="#22d3ee" stop-opacity="0" />
                <stop offset="93%" stop-color="#22d3ee" stop-opacity="0.55" />
                <stop offset="100%" stop-color="#cffafe" stop-opacity="0.9" />
              </radialGradient>
              <linearGradient id="pb-silver-a" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#94a3b8" />
                <stop offset="18%" stop-color="#f8fafc" />
                <stop offset="36%" stop-color="#cbd5e1" />
                <stop offset="52%" stop-color="#ffffff" />
                <stop offset="70%" stop-color="#64748b" />
                <stop offset="86%" stop-color="#e2e8f0" />
                <stop offset="100%" stop-color="#475569" />
              </linearGradient>
              <linearGradient id="pb-silver-b" x1="100%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#475569" />
                <stop offset="22%" stop-color="#cbd5e1" />
                <stop offset="48%" stop-color="#f8fafc" />
                <stop offset="76%" stop-color="#94a3b8" />
                <stop offset="100%" stop-color="#334155" />
              </linearGradient>
              <clipPath id="pb-planet-clip">
                <circle cx="32" cy="32" r="15" />
              </clipPath>
              <clipPath id="pb-back-clip">
                <rect x="-20" y="-20" width="104" height="52" />
              </clipPath>
              <clipPath id="pb-front-clip">
                <rect x="-20" y="32" width="104" height="52" />
              </clipPath>
              <g id="pb-rings">
                <path d="M 32,23.5 A 30.5,8.5 0 1,0 32,40.5 A 30.5,8.5 0 1,0 32,23.5 Z M 32,24.8 A 26,7.24 0 1,1 32,39.2 A 26,7.24 0 1,1 32,24.8 Z" fill="url(#pb-silver-a)" fill-rule="evenodd" />
                <path d="M 32,25.18 A 24.5,6.82 0 1,0 32,38.82 A 24.5,6.82 0 1,0 32,25.18 Z M 32,26.54 A 19.5,5.43 0 1,1 32,37.46 A 19.5,5.43 0 1,1 32,26.54 Z" fill="url(#pb-silver-b)" fill-rule="evenodd" />
                <path d="M 32,26.9 A 18.2,5.07 0 1,0 32,37.1 A 18.2,5.07 0 1,0 32,26.9 Z M 32,27.35 A 16.6,4.62 0 1,1 32,36.65 A 16.6,4.62 0 1,1 32,27.35 Z" fill="#94a3b8" fill-opacity="0.32" fill-rule="evenodd" />
              </g>
            </defs>
            <g transform="rotate(-26 32 32)">
              <g clip-path="url(#pb-back-clip)">
                <use href="#pb-rings" />
                <ellipse cx="37.5" cy="27" rx="8" ry="4" fill="#02151f" fill-opacity="0.75" />
              </g>
            </g>
            <g>
              <circle cx="32" cy="32" r="15" fill="url(#pb-globe)" />
              <g clip-path="url(#pb-planet-clip)">
                <path d="M 15,26 Q 32,29.5 49,26 L 49,29 Q 32,32.5 15,29 Z" fill="#0891b2" fill-opacity="0.4" />
                <path d="M 15,31.5 Q 32,35 49,31.5 L 49,34 Q 32,37.5 15,34 Z" fill="#22d3ee" fill-opacity="0.25" />
                <path d="M 15,36 Q 32,39.5 49,36 L 49,39 Q 32,42.5 15,39 Z" fill="#032533" fill-opacity="0.45" />
                <path d="M 15,30 Q 32,35.5 49,30 L 49,32.8 Q 32,38.3 15,32.8 Z" fill="#02121a" fill-opacity="0.65" />
                <ellipse cx="25.5" cy="22.5" rx="5.5" ry="2.8" transform="rotate(-26 25.5 22.5)" fill="#ffffff" fill-opacity="0.5" />
              </g>
              <circle cx="32" cy="32" r="15" fill="url(#pb-rim)" />
              <circle cx="32" cy="32" r="15" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.85" />
            </g>
            <g transform="rotate(-26 32 32)">
              <g clip-path="url(#pb-front-clip)">
                <use href="#pb-rings" />
                <ellipse cx="32" cy="32" rx="28.5" ry="7.9" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.8" />
              </g>
            </g>
          </svg>
          <div class="preboot-reticle"></div>
        </div>
        <div class="preboot-tag">TANGENT SF RP // INITIALIZING QUANTUM CORE</div>
        <div class="preboot-sub">CONNECTING TO TERRAN DATA NET SATELLITE ARRAYS...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
