<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cyan Globe Radial Gradient (Light from Top-Left ~10 o'clock) -->
    <radialGradient id="rp-globe" cx="34%" cy="30%" r="66%">
      <stop offset="0%" stop-color="#ecfeff" />
      <stop offset="16%" stop-color="#a5f3fc" />
      <stop offset="38%" stop-color="#22d3ee" />
      <stop offset="68%" stop-color="#0891b2" />
      <stop offset="88%" stop-color="#0e4b5c" />
      <stop offset="100%" stop-color="#031b24" />
    </radialGradient>

    <!-- Atmosphere Rim Highlight -->
    <radialGradient id="rp-rim" cx="50%" cy="50%" r="50%">
      <stop offset="76%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="93%" stop-color="#22d3ee" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#cffafe" stop-opacity="0.9" />
    </radialGradient>

    <!-- Outer Silver Ring Gradient (Metallic Sheen) -->
    <linearGradient id="rp-silver-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="18%" stop-color="#f8fafc" />
      <stop offset="36%" stop-color="#cbd5e1" />
      <stop offset="52%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="86%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Inner Silver Ring Gradient -->
    <linearGradient id="rp-silver-b" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="22%" stop-color="#cbd5e1" />
      <stop offset="48%" stop-color="#f8fafc" />
      <stop offset="76%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Planet Mask for Surface Details -->
    <clipPath id="rp-planet-clip">
      <circle cx="32" cy="32" r="15" />
    </clipPath>

    <!-- Back Ring Clip (Top half behind planet in rotated frame) -->
    <clipPath id="rp-back-clip">
      <rect x="-20" y="-20" width="104" height="52" />
    </clipPath>

    <!-- Front Ring Clip (Bottom half in front of planet in rotated frame) -->
    <clipPath id="rp-front-clip">
      <rect x="-20" y="32" width="104" height="52" />
    </clipPath>

    <!-- Dual Silver Ring Geometry -->
    <g id="rp-rings">
      <!-- Outer Ring A -->
      <path d="M 32,23.5 A 30.5,8.5 0 1,0 32,40.5 A 30.5,8.5 0 1,0 32,23.5 Z M 32,24.8 A 26,7.24 0 1,1 32,39.2 A 26,7.24 0 1,1 32,24.8 Z" 
            fill="url(#rp-silver-a)" fill-rule="evenodd" />
      
      <!-- Inner Ring B -->
      <path d="M 32,25.18 A 24.5,6.82 0 1,0 32,38.82 A 24.5,6.82 0 1,0 32,25.18 Z M 32,26.54 A 19.5,5.43 0 1,1 32,37.46 A 19.5,5.43 0 1,1 32,26.54 Z" 
            fill="url(#rp-silver-b)" fill-rule="evenodd" />

      <!-- Faint Crepe Ring C -->
      <path d="M 32,26.9 A 18.2,5.07 0 1,0 32,37.1 A 18.2,5.07 0 1,0 32,26.9 Z M 32,27.35 A 16.6,4.62 0 1,1 32,36.65 A 16.6,4.62 0 1,1 32,27.35 Z" 
            fill="#94a3b8" fill-opacity="0.32" fill-rule="evenodd" />
    </g>
  </defs>

  <!-- 1. BACK SECTION OF RING (Behind Globe) -->
  <g transform="rotate(-26 32 32)">
    <g clip-path="url(#rp-back-clip)">
      <use href="#rp-rings" />
      <!-- Shadow cast onto back ring by the planetary body -->
      <ellipse cx="37.5" cy="27" rx="8" ry="4" fill="#02151f" fill-opacity="0.75" />
    </g>
  </g>

  <!-- 2. GLOBE (Planet Body) -->
  <g>
    <!-- Base Spherical Shading -->
    <circle cx="32" cy="32" r="15" fill="url(#rp-globe)" />

    <!-- Planetary Surface Bands & Ring Shadow (Clipped to Globe) -->
    <g clip-path="url(#rp-planet-clip)">
      <!-- Atmospheric Band 1 -->
      <path d="M 15,26 Q 32,29.5 49,26 L 49,29 Q 32,32.5 15,29 Z" fill="#0891b2" fill-opacity="0.4" />
      <!-- Atmospheric Band 2 -->
      <path d="M 15,31.5 Q 32,35 49,31.5 L 49,34 Q 32,37.5 15,34 Z" fill="#22d3ee" fill-opacity="0.25" />
      <!-- Atmospheric Band 3 -->
      <path d="M 15,36 Q 32,39.5 49,36 L 49,39 Q 32,42.5 15,39 Z" fill="#032533" fill-opacity="0.45" />

      <!-- Ring Shadow Cast on Planet Surface -->
      <path d="M 15,30 Q 32,35.5 49,30 L 49,32.8 Q 32,38.3 15,32.8 Z" fill="#02121a" fill-opacity="0.65" />

      <!-- Specular Polar Highlight -->
      <ellipse cx="25.5" cy="22.5" rx="5.5" ry="2.8" transform="rotate(-26 25.5 22.5)" fill="#ffffff" fill-opacity="0.5" />
    </g>

    <!-- Atmospheric Limb / Rim Glow -->
    <circle cx="32" cy="32" r="15" fill="url(#rp-rim)" />
    <!-- Fine Luminous Outer Perimeter -->
    <circle cx="32" cy="32" r="15" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.85" />
  </g>

  <!-- 3. FRONT SECTION OF RING (In Front of Globe) -->
  <g transform="rotate(-26 32 32)">
    <g clip-path="url(#rp-front-clip)">
      <use href="#rp-rings" />
      <!-- Specular Glint on Front Outer Rim -->
      <ellipse cx="32" cy="32" rx="28.5" ry="7.9" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.8" />
    </g>
  </g>
</svg>